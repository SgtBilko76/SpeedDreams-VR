# Speed Dreams VR settings (this copy lives in /sdcard/SpeedDreamsVR/vr.cfg;
# edit it and restart the app)

# Display refresh rate in Hz. Quest 2/3 support 72, 80, 90, 120. 0 = system default.
refresh = 72

# Eye buffer size as a fraction of the runtime's *recommended* resolution, not
# of what the panels can show. The runtime picks that recommendation to leave
# headroom, and on a Quest 3 it is well under half the pixels the display is
# capable of - so 1.0 is not "full resolution", it is "whatever the runtime
# suggests", and the image looks soft. Above 1.0 is where the sharpness is.
#
# It is also what the frame costs now: since the HUD text is cached, the
# processor has headroom and the graphics chip is the limit in a race (97% busy
# at 1.4), so this is the dial between sharpness and frame rate. 1.2 holds
# frame rate better; 1.4 is sharper. 1.35 holds 72 fps on Migrants with
# msaa off and foveation 2. The log line "Eye buffer WxH at scale S"
# says exactly what you asked for and what the runtime will allow.
# Clamped to that maximum, and to 2.0.
supersampling = 1.35

# Multisampling (edge antialiasing) for the eye buffers: 1 = off, 2, 4 or 8.
# Resolved in tile memory, so far cheaper than the equivalent supersampling, but
# not free: measured on Jarama, 1 = 65-69 fps, 2 = 63-71, 4 = 52-56.
# 1 is the default since foveated rendering came in: on Migrants it freed the
# graphics chip (97% -> about 80% busy) and the edges still looked fine.
msaa = 1

# Fixed foveated rendering: the edges of each eye image, which the lenses blur
# anyway, are drawn at lower detail, the centre at full. Saves graphics-chip
# time, which is what limits the frame rate in a race.
# 0 = off, 1 = low, 2 = medium, 3 = high (most saving, edges visibly coarser).
foveation = 2

# Rear-view mirror (right stick click turns it on). Where it sits in front of
# you: degrees above straight ahead, and metres away. The distance is what the
# two eyes converge on, so if it will not fuse into one mirror, change it.
# The scale is a fraction of the size the game would use on a monitor, where
# the mirror is half the screen wide - far too much for a headset.
mirror_height_deg = 25
mirror_distance = 1.0
mirror_scale = 0.325

# Floating menu screen: distance in metres.
screen_distance = 2.5

# Steering response. A thumbstick reaches full lock in about fifteen
# millimetres of travel, so a linear response is far too quick to hold a line
# with, and where exactly it should sit is a matter of taste - hence these two
# rather than a number compiled in.
#
# steer_sensitivity is the reciprocal of the exponent applied to how far the
# stick is pushed. Below 1 it flattens the response around centre, where the
# small corrections are, and still reaches full lock at the stop: 1.0 is
# linear, 0.45 is calm, 0.3 is very calm and starts to feel remote.
#
# steer_speed_sensitivity then divides the result by 1 + s * speed/100, with
# speed in m/s, so the car settles down at racing speed without going sluggish
# in the pits. 0 turns it off; 1.0 gives about 70% of full lock at 150 km/h.
#
# Both override the values in the player profile. Comment them out to go back
# to whatever the profile says.
steer_sensitivity = 0.35
steer_speed_sensitivity = 1.5

# Force feedback, played as controller rumble. The game already computes a
# steering force for a wheel; there is no wheel here, so the same number drives
# the controllers instead. The hand the wheel is pulling towards gets the
# stronger side of it, so it reads as a direction and not just noise.
#
# ffb_rumble_deadzone is a fraction of full force, below which nothing happens.
# It matters: the force feedback code adds a constant minimum to any non-zero
# force so a real wheel is never slack, and without a deadzone the controllers
# would buzz quietly for the whole race. Raise it if that still happens, lower
# it for more detail through the corners.
ffb_rumble = 1
ffb_rumble_scale = 1.0
ffb_rumble_deadzone = 0.15
